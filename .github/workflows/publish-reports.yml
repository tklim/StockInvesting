name: Publish backtest reports

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build portable dashboard site
        run: >-
          python backtest/publish_reports_site.py
          --reports-dir backtest/outputs/reports
          --charts-dir backtest/outputs/charts
          --site-dir _site

      - name: Upload dashboard reports
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy dashboard reports
        id: deployment
        uses: actions/deploy-pages@v4
